name: Build CongcongTV iOS IPA (XGZY)

on:
  workflow_dispatch:
  push:
    paths:
      - "tvbox/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify Guazi RSA key import and encryption
        run: |
          swiftc -parse-as-library \
            tvbox/Services/GuaziCrypto.swift \
            scripts/verify-guazi-crypto.swift \
            -o /tmp/verify-guazi-crypto
          /tmp/verify-guazi-crypto

      - name: Verify Guazi playback request parameter preservation
        run: |
          swiftc \
            tvbox/Services/GuaziPlaybackRequest.swift \
            scripts/verify-guazi-playback-request.swift \
            -o /tmp/verify-guazi-playback-request
          /tmp/verify-guazi-playback-request

      - name: Verify Guazi loopback HTTP playback route
        run: |
          swiftc -parse-as-library -framework Network \
            tvbox/Services/GuaziPlaybackRequest.swift \
            tvbox/Services/GuaziPlaybackProxy.swift \
            scripts/verify-guazi-playback-proxy.swift \
            -o /tmp/verify-guazi-playback-proxy
          /tmp/verify-guazi-playback-proxy

      - name: Verify Guazi playback cloud ordering
        run: |
          swiftc -parse-as-library \
            tvbox/Services/GuaziPlaybackCloudOrder.swift \
            scripts/verify-guazi-playback-cloud-order.swift \
            -o /tmp/verify-guazi-playback-cloud-order
          /tmp/verify-guazi-playback-cloud-order

      - name: Verify Guazi categories and metadata parsing
        run: |
          swiftc -parse-as-library \
            tvbox/Models/MovieSort.swift \
            tvbox/Services/GuaziHomeCategoryOrder.swift \
            tvbox/Services/GuaziPlaylistCatalog.swift \
            tvbox/Services/GuaziMetadataParser.swift \
            scripts/verify-guazi-metadata.swift \
            -o /tmp/verify-guazi-metadata
          /tmp/verify-guazi-metadata

      - name: Verify Guazi search title filtering
        run: |
          swiftc -parse-as-library \
            tvbox/Services/GuaziSearchMatcher.swift \
            scripts/verify-guazi-search.swift \
            -o /tmp/verify-guazi-search
          /tmp/verify-guazi-search

      - name: Verify downloaded media payload validation
        run: |
          swiftc -parse-as-library \
            tvbox/Services/DownloadPayloadValidator.swift \
            scripts/verify-download-payload.swift \
            -o /tmp/verify-download-payload
          /tmp/verify-download-payload

      - name: Verify offline HLS manifest handling
        run: |
          swiftc -parse-as-library \
            tvbox/Services/HLSOfflineManifest.swift \
            scripts/verify-hls-offline-manifest.swift \
            -o /tmp/verify-hls-offline-manifest
          /tmp/verify-hls-offline-manifest

      - name: Verify per-episode playback progress
        run: |
          swiftc -parse-as-library \
            tvbox/Persistence/VodPlaybackState.swift \
            scripts/verify-playback-progress.swift \
            -o /tmp/verify-playback-progress
          /tmp/verify-playback-progress

      - name: Verify M3U8 purifier behavior
        run: |
          swiftc -parse-as-library -framework Network \
            tvbox/Services/NetworkManager.swift \
            tvbox/Services/M3U8Purifier.swift \
            scripts/verify-m3u8-purifier.swift \
            -o /tmp/verify-m3u8-purifier
          /tmp/verify-m3u8-purifier

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project CongcongTV.xcodeproj \
            -scheme CongcongTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            | tee build.log

      - name: Verify built app metadata and config
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          expected_default_url = "https://ghproxy.net/https://raw.githubusercontent.com/JackEric6/movie/refs/heads/xgzy-config-20260922/movie2_xgzy_all"
          app_source = Path("tvbox/tvboxApp.swift").read_text(encoding="utf-8")
          assert expected_default_url in app_source

          source_config = Path("tvbox/Resources/movie2_xgzy_sources.json")
          import json
          sources = json.loads(source_config.read_text(encoding="utf-8"))["sites"]
          assert len(sources) == 41
          assert len({item["key"] for item in sources}) == 41
          assert sources[0]["key"] == "xgzy"
          assert all(item["type"] == 1 for item in sources)
          assert all("127.0.0.1" not in item["api"] and "localhost" not in item["api"] for item in sources)

          app = Path("build/Build/Products/Release-iphoneos/CongcongTV.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          assert info["CFBundleIdentifier"] == "com.congcong.tv.xgzy"
          assert info["CFBundleExecutable"] == "CongcongTV"
          assert info["CFBundlePackageType"] == "APPL"
          assert info["CFBundleDisplayName"] == "CongcongTV"
          assert info["MinimumOSVersion"] == "17.0"
          assert (app / info["CFBundleExecutable"]).is_file()
          assert (app / "zh-Hans.lproj/InfoPlist.strings").is_file()
          print("APP METADATA AND XGZY DEFAULT CONFIG CHECKS PASSED")
          PY

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/CongcongTV.app ipa/Payload/
          cd ipa
          zip -qry ../CongcongTV-unsigned.ipa Payload

      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: CongcongTV-iOS-unsigned-ipa
          path: |
            CongcongTV-unsigned.ipa
            build.log
          if-no-files-found: error

      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: CongcongTV-unsigned-ipa
          path: |
            CongcongTV-unsigned.ipa
            build.log
